input.dp-input { cursor: text; }
input.dp-input:disabled { cursor: default; color: var(--text-3); background: #f2f2f4; }
.dp-pop {
  position: fixed; z-index: 1300;
  width: 272px;
  background: #fff; border-radius: var(--r-xl);
  box-shadow: var(--shadow-pop);
  padding: 12px;
  user-select: none;
}
.dp-head {
  display: flex; align-items: center; gap: 4px;
  margin-bottom: 8px;
}
.dp-title {
  flex: 1; text-align: center;
  font: var(--f-body-m); color: var(--text);
}
.dp-year-btn {
  border: none; background: none; cursor: pointer;
  font: var(--f-body-m); color: var(--text);
  padding: 0 4px; border-radius: 6px; vertical-align: baseline;
  transition: background var(--t-fast), color var(--t-fast);
}
.dp-year-btn:hover { background: var(--accent-soft); color: var(--accent); }
/* 年份编辑态（v1.2.1）：行内文本框——无边框透明底、字号与「年 11 月」一致、
   居中、宽度自适应 4 位数字；聚焦仅淡下划线示意（与 dp-pop 柔和调性一致） */
.dp-year-in {
  /* 显式宽高：4 位数字+光标要 56px；高度与「年 11 月」行一致（压掉基础层 36px） */
  width: 56px; padding: 0 2px;
  min-height: 0; height: 26px; line-height: 26px;
  border: none; border-radius: 6px;
  background: transparent; color: var(--text);
  font: var(--f-body-m); text-align: center;
  font-variant-numeric: tabular-nums;
  caret-color: var(--accent);
  vertical-align: baseline;
  user-select: text; /* 弹层整体 none，这里恢复可选中 */
}
.dp-year-in:focus {
  outline: none;
  background: rgba(0, 113, 227, .06);
  box-shadow: 0 1px 0 0 var(--accent); /* 淡下划线示意聚焦 */
}
.dp-year-in::selection { background: var(--accent-soft); }
.dp-nav {
  width: 28px; height: 28px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none; border-radius: 8px;
  cursor: pointer; color: var(--text-2);
  transition: background var(--t-fast);
}
.dp-nav:hover { background: #f2f2f6; }
.dp-today-btn {
  border: none; background: none; cursor: pointer;
  font: var(--f-cap-m); color: var(--accent);
  padding: 4px 8px; border-radius: 8px;
  transition: background var(--t-fast);
}
.dp-today-btn:hover { background: var(--accent-soft); }
.dp-week {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  font: var(--f-cap-2); color: var(--text-3); text-align: center;
  padding: 2px 0 4px;
}
.dp-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
}
.dp-day {
  width: 100%; aspect-ratio: 1;
  border: none; background: none; border-radius: 8px;
  font: var(--f-body-2); color: var(--text);
  cursor: pointer; padding: 0;
  transition: background var(--t-fast);
}
.dp-day:hover { background: #f2f2f6; }
.dp-day.dp-out { color: var(--text-3); opacity: .55; }
.dp-day.dp-today { outline: 2px solid var(--accent); outline-offset: -1px; }
.dp-day.dp-sel {
  background: #aecbfa; /* 习惯蓝填充 */
  font-weight: 600;
}
.dp-day.dp-sel:hover { background: #aecbfa; }
.dp-foot {
  display: flex; justify-content: space-between;
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--line-soft);
}
.dp-txt-btn {
  border: none; background: none; cursor: pointer;
  font: var(--f-cap-m); color: var(--text-2);
  padding: 4px 10px; border-radius: 8px;
  transition: background var(--t-fast), color var(--t-fast);
}
.dp-txt-btn:hover { background: #f2f2f6; color: var(--text); }

/* —— 弹窗最终态（合并 styles.css 旧 14px 层 + 本文件多轮覆盖）：24px 圆角 + 轻影（层次靠遮罩）
   + 缩放模糊进出场（隐藏态过渡沿用 styles 原 transform .22s，未被覆盖过） —— */
.modal {
  background: #fff;
  border-radius: 24px;
  width: 100%; max-width: min(92vw, 560px); max-height: 88vh;
  display: flex; flex-direction: column;
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, .05);
  transform: translateY(10px) scale(.85);
  filter: blur(4px);
  opacity: 0;
  transition: transform .22s cubic-bezier(.2, .8, .2, 1);
}
/* 丙8 弹窗宽度三档兜底：sm 440 / md 560（默认档）/ lg 720。
   JS 的 opts.width 仍以 ui.js 内联 max-width 为准（该文件归他人改）；这组类为宽度映射预留。 */
.modal-sm { max-width: min(92vw, 440px); }
.modal-lg { max-width: min(92vw, 720px); }
.modal-mask.show .modal {
  transform: translateY(0) scale(1);
  filter: blur(0);
  opacity: 1;
  transition: transform .3s cubic-bezier(.32, .72, 0, 1), opacity .3s ease-out, filter .3s ease-out;
}
.modal-head {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 12px;
  padding: 24px 24px 8px;
}
.modal-head h3 { font: 500 18px/26px var(--font); letter-spacing: -0.015em; }
.modal-close { margin-left: auto; } /* v1.1.9：headExtra（标题旁控件）靠左，关闭钮恒最右 */
/* v1.1.9：分类屏蔽弱化（记账表单不显示，仅设置一览标记状态） */
.wcat-hidden { opacity: .45; }

/* ===== v1.2.01：分类合并弹窗（统计口径，双栏） ===== */
.cmg-mode { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.cmg-mode label { font-size: 13px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.cmg-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cmg-left, .cmg-right { min-width: 0; }
.cmg-l1 { font-weight: 600; font-size: 13px; margin: 8px 0 4px; display: flex; align-items: center; gap: 6px; }
.cmg-l2 {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px; border-radius: 8px; font-size: 12.5px;
}
.cmg-l2:hover { background: #f2f2f6; }
/* v1.2.01 A：多选态（点行选中，右侧批量归组） */
.cmg-l2.cmg-sel { background: rgba(15, 118, 238, .10); box-shadow: inset 0 0 0 1px rgba(15, 118, 238, .28); }
.cmg-join { flex: none; font-size: 11px; height: 26px; padding: 0 8px; }
.cmg-l2 select {
  flex: none; width: 108px; height: 26px; font-size: 12px;
  border: 1px solid var(--line); border-radius: 7px; background: #fff;
}
.cmg-group {
  position: relative; padding: 8px 10px; margin-bottom: 8px;
  border: 1px solid var(--line-soft); border-radius: 10px; background: #fafafc;
}
.cmg-group.on { border-color: var(--accent); }
.cmg-ghead { display: flex; align-items: center; gap: 6px; }
.cmg-gname {
  flex: 1; min-width: 0; height: 28px; font-size: 13px; font-weight: 600;
  border: 1px solid transparent; border-radius: 7px; padding: 0 8px; background: transparent;
}
.cmg-gname:hover, .cmg-gname:focus { border-color: var(--line); background: #fff; }
.cmg-members { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.cmg-members .tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; }
.cmg-note { margin: -2px 0 10px; }

/* ===== v1.1.9：记一笔 · 模板下拉清单（方案 A） ===== */
.yw-tpl-row { position: relative; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; min-height: 30px; }
.yw-tpl-pop {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 40;
  width: 340px; max-height: 280px; overflow-y: auto;
  background: var(--panel, #fff); border: 1px solid var(--line-soft);
  border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .12); padding: 6px;
}
.yw-tpl-pop[hidden] { display: none; }
.yw-tpl-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 8px;
  cursor: pointer; transition: background var(--t-fast);
}
.yw-tpl-item:hover { background: #f2f2f6; }
.yw-tpl-item-main { flex: 1; min-width: 0; }
.yw-tpl-item-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.yw-tpl-item-sub { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.yw-tpl-item-amt { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.yw-tpl-item-del { opacity: 0; transition: opacity var(--t-fast); }
.yw-tpl-item:hover .yw-tpl-item-del { opacity: 1; }
.yw-tpl-on {
  display: inline-flex; align-items: center; gap: 4px;
  background: #e8f1ff; color: var(--accent, #0071e3); border: 1px solid rgba(0, 113, 227, .25);
}

/* ===== v1.2.0 卡头（拍板终态）：固定两行——第一行 标题+工具钮，第二行 导航居中。
   不做任何宽度回弹（用户拍板：不要回弹）；按钮随内容自然宽 */
#home-todos .panel-head, #home-habits .panel-head {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  grid-template-areas: "icon title . tools" "nav nav nav nav";
  align-items: center; column-gap: 8px; row-gap: 6px;
  padding: 12px 16px 6px;
}
.ch-icon { grid-area: icon; display: inline-flex; }
.card-title {
  grid-area: title;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 15px; font-weight: 600;
}
.ch-nav { grid-area: nav; justify-self: center; display: inline-flex; }
.ch-tools { grid-area: tools; display: inline-flex; gap: 6px; }
.ch-pair { display: inline-flex; align-items: center; gap: 8px; }
#home-todos .home-tool-btn, #home-habits .home-tool-btn { width: 24px; height: 24px; }
.card-tools {
  display: inline-flex; align-items: center; gap: 6px;
  flex: none; white-space: nowrap;
}
.seg-nav {
  display: inline-flex; align-items: center;
  background: #e9e9ee; border-radius: 999px; padding: 3px;
}
.seg-nav .btn-icon { width: 24px; height: 24px; }
.seg-nav-label {
  min-width: 64px; text-align: center; /* 自适应宽（第二行居中后不再强求等长） */
  font-size: 12.5px; font-weight: 500; color: var(--text); /* 与 seg-toggle 按钮同字阶（拍板） */
}
.tool-link {
  border: none; background: none; padding: 0 6px;
  font-size: 12px; color: var(--text-2); cursor: pointer; font-family: inherit;
}
.home-tool-btn {
  width: 26px; height: 26px; padding: 0; border: none; background: none;
  color: var(--text-2); border-radius: 6px; cursor: pointer;
}
/* 悬停不变（拍板）：纯图标、无 hover 形变/变色 */

/* ===== v1.2.0：主页待办事项（倒计时进度 + 过期确认） ===== */
.todo-prio {
  width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: #f59e0b;
}
.todo-prio.p-high { background: #ff3b30; }
.todo-prio.p-low { background: #c7c7cc; }
.todo-rep {
  font-size: 10px; padding: 1px 6px; border-radius: 980px;
  background: #eef0ff; color: var(--accent); font-weight: 500;
}
#home-todos .panel-body { display: flex; flex-direction: column; gap: 8px; }
/* 单日条目过多卡内上下翻（与穿搭推荐卡高度大致对齐） */
#home-todos .todo-body {
  max-height: 300px; overflow-y: auto; scrollbar-width: thin;
}
.todo-nav { display: inline-flex; align-items: center; gap: 2px; }
.todo-nav-label { font-size: 12.5px; font-weight: 600; min-width: 74px; text-align: center; }
.todo-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 10px; background: #f6f6f9;
}
.todo-row.todo-over { background: #fff2f0; }
/* 已完成=绿（对齐全站 done 配方），跳过=灰；无文字标签 */
.todo-row.todo-done { background: #f0faf2; }
.todo-row.todo-skipped { opacity: .55; }
.todo-main { flex: 1; min-width: 0; }
.todo-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.todo-bar { height: 5px; border-radius: 980px; background: #e5e5ea; margin: 5px 0 3px; overflow: hidden; }
.todo-bar-fill { height: 100%; border-radius: 980px; background: var(--accent); transition: width .3s; }
.todo-bar-fill.over { background: var(--red, #ff3b30); }
.todo-left { font-size: 11px; color: var(--text-3); }
.todo-over .todo-left { color: var(--red, #ff3b30); }
.todo-acts { display: flex; gap: 6px; flex: none; }

/* ===== v1.1.9：hover 操作统一规格（全站）——右侧划入预留槽（占位对齐，不盖内容） =====
   槽内按钮占位但透明 → hover/focus-within 时从右划入；同构元素操作区上下对齐。
   触屏（hover:none）常驻；删除类仍走确认弹窗 */
.op-host { position: relative; }
.op-float {
  display: inline-flex; gap: 2px; align-items: center; justify-content: flex-end;
  flex: none;
  opacity: 0; transform: translateX(6px);
  transition: opacity .15s ease, transform .15s ease;
}
.op-host:hover > .op-float, .op-host:focus-within > .op-float {
  opacity: 1; transform: translateX(0);
}
.chip-op {
  width: 26px; height: 26px; padding: 0; border: none; background: none;
  cursor: pointer; color: var(--text-2); border-radius: 6px;
}
.chip-op:hover { background: rgba(0, 0, 0, .06); color: var(--text); }
@media (hover: none) {
  .op-float { opacity: 1; transform: none; }
}

/* ===== v1.1.9：设置分类一览 · chip 流 + hover 划入预留槽（同全站规格） ===== */
.ycat-row { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.ycat-row:last-child { border-bottom: none; }
.ycat-row.wcat-hidden { opacity: .45; border-left: 2px dashed var(--line); padding-left: 8px; }
.ycat-row-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.ycat-row-head strong { font-size: 13.5px; }
.ycat-row-ops {
  display: inline-flex; gap: 2px; margin-left: auto; flex: none;
  opacity: 0; transform: translateX(6px);
  transition: opacity .15s ease, transform .15s ease;
}
.ycat-row:hover .ycat-row-ops, .ycat-row:focus-within .ycat-row-ops {
  opacity: 1; transform: translateX(0);
}
.ycat-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 2px; }
/* v1.1.9 chip 定稿：名称区统一 4 字符宽（长短都对齐）+ 操作区常驻预留（透明占位），
   hover 在预留区内右划入——不推挤任何元素 */
.ycat-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 8px; border-radius: 999px; background: #f2f2f6; font-size: 12.5px;
}
.ycat-chip > span:first-of-type {
  width: 52px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ycat-chip.wcat-hidden { background: transparent; border: 1px dashed var(--line); }
.ycat-chip-ops {
  display: inline-flex; gap: 0; flex: none;
  opacity: 0; transform: translateX(6px); /* 预留距离：占位透明 */
  transition: opacity .15s ease, transform .15s ease;
}
.ycat-chip:hover .ycat-chip-ops, .ycat-chip:focus-within .ycat-chip-ops {
  opacity: 1; transform: translateX(0); /* 槽内划入，零推挤 */
}
.ycat-chip .chip-op { width: 22px; height: 22px; }
@media (hover: none) {
  .ycat-chip-ops, .ycat-row-ops { opacity: 1; transform: none; }
}
.modal-body { overflow-y: auto; min-height: 0; padding: 8px 24px 16px; }
.modal-foot {
  flex-shrink: 0;
  display: flex; justify-content: flex-end;
  padding: 12px 24px 24px; gap: 8px;
}

/* —— Toast：浮层双层轻影 + 进出场 —— */
.toast {
  border-radius: 16px;
  border: 1px solid var(--line-soft);
  box-shadow: 0 1px 1px 0 rgba(0, 0, 0, .04), 0 4px 12px 0 rgba(0, 0, 0, .10);
  animation: toast-in .25s ease-out;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateY(12px) scale(.97); filter: blur(4px); }
  to { opacity: 1; transform: none; filter: blur(0); }
}

/* —— 数值等宽（金额/统计值对齐） —— */
.kpi-value, .yw-bal-val, .yw-month-val, .home-mini-val, .bill-amt, .yw-bill-amt,
.yw-amt-input, .rank-value, .kpi-hero-value {
  font-variant-numeric: tabular-nums;
}

/* —— 标题字重收敛：标题用 medium(500)~600，正文四级色阶 —— */
/* （.modal-head h3 定稿在上方「弹窗最终态」段，font 带 var(--font)） */
.kpi-hero-label, .yw-bal-label { color: var(--text-2); }

/* —— 卡片层次法：灰底上的白内嵌块（1px 接触影） —— */
.yw-month-head, .home-mini {
  background: #f6f6f9;
}
/* v1.2.0 戊：yw-bal-cell 已并入 .stat-kpi（白块+接触影），此处只留 home-mini */
.home-mini {
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .02);
}

/* —— 状态色对：浅底 + 深字（成功/警告/错误） —— */
.tag-ok { background: #e8f8ec; color: #1d7a36; }
.tag-warn { background: #fdf1d8; color: #9a6b00; }
.tag-err { background: #fdebe9; color: #b3261e; }

/* —— 标签/徽章圆角按规格：chip 6px、badge 4px —— */
.tag { border-radius: 6px; }
.badge { border-radius: 4px; }

/* —— 分段控件：灰轨道 + 白滑块 —— */
/* ===== 分段切换最终态（v1.1.6 统一）：灰胶囊轨道 + 选中白胶囊（每颗完整胶囊圆角） ===== */
.seg-toggle {
  background: #e9e9ee; border-radius: 999px; padding: 3px; gap: 2px;
  border: none; display: inline-flex;
}
.seg-btn {
  border: none; border-radius: 999px; padding: 5px 14px;
  background: transparent; font: var(--f-body-2); color: var(--text-2);
  cursor: pointer; font-family: inherit;
  white-space: nowrap; /* v1.1.9：切换器文字永不折行（支出/收入/转账曾被压成竖排） */
}
.seg-btn.on {
  background: var(--panel); font-weight: 500; color: var(--text);
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, .08);
}
.seg-btn:hover:not(.on) { color: var(--text); }

/* —— 表格/列表 hairline 统一 —— */
.mini-table, .cat-table { border-color: var(--line-soft); }
.mini-row { border-color: var(--line-soft); }

@media (prefers-reduced-motion: reduce) {
  .btn, .nav-item, .item-card, .modal, .toast, .seg-btn {
    transition: none !important; animation: none !important; transform: none !important;
    filter: none !important;
  }
  .modal { opacity: 1; }
  .modal-mask.show .modal { transform: none; }
}

/* ============================================================
   侧栏对齐（浮岛式导航）：白卡浮岛 / 账号行 / 搜索 pill /
   选中低调态（浅蓝底 + 细描边，丙1） / 底部信息卡
   ============================================================ */
/* 壳层 / 侧栏 / 主区最终态（合并 styles.css 毛玻璃旧层 + 本文件壳层/二次/三次精修层）：
   白底纯色、20px 圆角、1px rgba(0,0,0,.045) 描边、三层柔光外晕、默认宽 200px。
   注：.sidebar 的 position:sticky;top:0 留在 styles.css（≤860px 媒体查询接管为 relative）。 */
.app, #app {
  display: flex; gap: 6px; padding: 12px; height: 100%; min-height: 100vh;
  background: var(--bg);
  /* 最小窗口限制（v1.1.4）：内容宽不小于 1024px，窗口再小走横向滚动，布局不畸形不丢内容 */
  min-width: 1024px;
}
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: #ffffff;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  border: 1px solid rgba(0, 0, 0, .045);
  border-radius: 20px;
  box-shadow:
    0 1px 2px 0 rgba(0, 0, 0, .03),
    0 10px 32px 0 rgba(0, 0, 0, .07),
    0 0 1px 0 rgba(0, 0, 0, .10);
  display: flex; flex-direction: column;
  padding: 14px 12px;
  overflow: visible;
  height: calc(100vh - 24px);
}
.main {
  flex: 1; min-width: 0; width: 100%; max-width: 1720px; margin: 0 auto;
  height: calc(100vh - 24px); overflow-y: auto;
  background: var(--panel);
  border: 1px solid rgba(0, 0, 0, .045);
  border-radius: 20px;
  padding: 22px 26px;
  box-shadow:
    0 1px 2px 0 rgba(0, 0, 0, .03),
    0 10px 32px 0 rgba(0, 0, 0, .05),
    0 0 1px 0 rgba(0, 0, 0, .08);
}

/* 账号行（头像 + 名字） */
.side-account { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; }
.side-avatar {
  width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft);
  display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0;
}
.side-account-name {
  font: var(--f-body-m); color: var(--text); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* 搜索 pill（灰底胶囊 + 快捷键徽章） */
.side-search {
  display: flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 10px 0 12px;
  background: #f0f0f4; border-radius: 999px; margin-bottom: 12px;
}
.side-search-ic { display: flex; color: var(--text-3); flex-shrink: 0; }
.side-search input {
  flex: 1; min-width: 0; background: transparent; border: none; box-shadow: none;
  font: var(--f-body); color: var(--text); padding: 0; min-height: 0;
}
.side-search input:hover, .side-search input:focus { box-shadow: none; background: transparent; }
.side-kbd {
  font: var(--f-cap-2); color: var(--text-2); background: rgba(0, 0, 0, .06);
  border-radius: 6px; padding: 3px 7px; flex-shrink: 0; letter-spacing: .3px;
}

/* 导航项最终态（合并 styles.css 基础层 + 本文件四轮精修层）：
   46px 高、padding 0 12px、图标列 22px 左对齐、选中低调态（丙1 方案 A：浅蓝底 + 细描边） */
.nav { display: flex; flex-direction: column; gap: 3px; flex: 1; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; justify-content: flex-start; gap: 10px;
  height: 46px; padding: 0 12px;
  border-radius: 11px;
  font: var(--f-body); font-size: 15px;
  color: var(--text); text-decoration: none;
  cursor: pointer; user-select: none;
  transition: background var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out),
    box-shadow .2s var(--ease-out), transform var(--t-fast) var(--ease-out);
}
.nav-item .nav-icon {
  width: 22px; flex-shrink: 0; margin: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
}
/* v1.2.01：文字模式标签永不换行（最窄 150px 也不折行） */
.nav-item > span:not(.nav-icon) {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.nav-item:hover:not(.active) { background: #f2f2f6; }
.nav-item:hover:not(.active) .nav-icon { color: var(--text); }
/* 丙1 选中态低调版：浅蓝底 + inset 1px 细描边 + 文字/图标 accent 色（渐变/辉光已删） */
.nav-item.active {
  background: rgba(15, 118, 238, .10);
  color: var(--accent); font-weight: 500;
  box-shadow: inset 0 0 0 1px rgba(15, 118, 238, .28);
}
.nav-item.active .nav-icon { color: var(--accent); }
.nav-item.active:hover {
  background: rgba(15, 118, 238, .13);
  box-shadow: inset 0 0 0 1px rgba(15, 118, 238, .28);
}
.nav-item:active:not(.active) { transform: scale(.985); }

/* 底部信息卡（灰底圆角） */
.sidebar-foot { padding-top: 10px; }
.side-team {
  display: flex; align-items: center; gap: 10px;
  background: #f6f6f9; border-radius: 13px; padding: 10px 12px;
}
.side-team-logo {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  background: var(--grad-btn); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700;
}
.side-team-name { font: var(--f-body-m); color: var(--text); }
.sidebar-foot .muted { font: var(--f-cap-2); }

/* 侧栏宽度拖拽接缝 */
.sidebar-resizer { width: 6px; cursor: col-resize; position: absolute; right: -3px; top: 0; bottom: 0; }

/* ============================================================
   遮挡修复：固定高度容器改 min-height，行高不再裁切文字
   ============================================================ */
.detail-btn-row .btn, .detail-actions .btn { min-height: 36px; height: auto; }
/* （.modal-head h3 / .btn 定稿分别在「弹窗最终态」「按钮最终态」段，重复行已删） */
.nav-item span { line-height: 1.3; }
.page-head h2 { line-height: 1.35; }

@media (max-width: 900px) {
  .app, #app { padding: 8px; gap: 8px; }
  .sidebar { height: calc(100vh - 16px); }
  .main { height: calc(100vh - 16px); padding: 16px; }
}

/* 搜索下拉锚定在侧栏搜索框下方 */
.side-search { position: relative; }
.side-search .search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 80;
  max-height: 380px; overflow-y: auto;
}

/* ============================================================
   侧栏质感精修：底部结构
   （边框外晕/选中渐变辉光旧层已并入上方「侧栏对齐」分区最终态）
   ============================================================ */

/* 底部结构：分割线（靠下）→ 设置（贴线）→ 账户信息（最底） */
.sidebar-foot { padding-top: 6px; display: flex; flex-direction: column; gap: 4px; }
.side-divider {
  height: 1px; background: var(--line-soft);
  margin: 6px 6px 4px;
}
.sidebar-foot .nav-item { height: 42px; }
.side-account {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; margin-top: 4px;
  border-radius: 13px;
}
.side-account:hover { background: #f6f6f9; }
.side-avatar {
  width: 36px; height: 36px; font-size: 18px;
  background: #ececf1; color: var(--text-2);
}
.side-account-name { font: var(--f-body-m); }

/* （导航项悬停微光过渡/按压缩放已并入上方 .nav-item 最终态） */

/* ============================================================
   侧栏二次精修：单分割线（设置上·用户下）
   （纯白底/辉光收敛旧层已并入「侧栏对齐」分区最终态）
   ============================================================ */
/* 单分割线：设置在上、账户在下 */
.sidebar-foot { gap: 2px; }
.side-divider {
  height: 1px; background: var(--line-soft);
  margin: 6px 8px;
}
.side-account { cursor: pointer; }

/* ============================================================
   侧栏三次精修：单线 / 搜索左移不遮挡
   ============================================================ */
/* 只保留设置与账户之间的一条线：去掉 foot 顶部自带分割线 */
.sidebar-foot { border-top: none; }

/* 搜索栏：整体左移，首字不被遮挡 */
.side-search { padding: 0 8px 0 5px; gap: 6px; }
.side-search-ic { margin-left: 1px; }
.side-search input { padding: 0 2px; }

.side-account { justify-content: center; }

/* ============================================================
   侧栏四次精修：头像入列
   （默认收窄 --sidebar-w:200px 已并入 styles.css :root；导航图标列/左对齐已并入 .nav-item 最终态）
   ============================================================ */

/* 账户行：头像中心对齐图标列中心（nav padding12 + 图标列半宽11 = 23；头像半宽18 → 左 5px） */
.side-account {
  justify-content: flex-start;
  padding: 8px 12px;
}
.side-avatar {
  margin-left: -7px;   /* 36px 头像与 22px 图标列中心对齐 */
  display: flex; align-items: center; justify-content: center;
}
.side-account-name {
  margin-left: 7px;    /* 保持文字起点与 nav 文字列一致 */
}

/* ============================================================
   v1.1.6 统计/设置线（甲/丙清单）：空态卡 / 超宽屏收窄 /
   键盘焦点三套合一 / 校验红字 / 删除账号两档
   ============================================================ */

/* —— 丙3 空态卡：灰底 + 16px 圆角 + 1px 接触影 + 32px 内边距，全站空态统一底座 ——
   用法：<div class="empty-state empty-card"><div class="empty-icon">图标48</div><p>文案</p><button class="btn btn-ghost">引导</button></div> */
.empty-card {
  background: #f6f6f9;
  border-radius: 16px;
  box-shadow: var(--shadow-card);
  padding: 32px;
}
.empty-state.empty-card {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.empty-card .empty-icon { font-size: 48px; margin-bottom: 0; opacity: .45; }
.empty-card p { margin: 0; color: var(--text-2); }
.empty-card .btn { margin-top: 6px; }

/* —— 丙6 超宽屏收窄：2K/带鱼屏内容区封顶 1440px，两侧留白 —— */
.main > #main-content { max-width: 1440px; margin: 0 auto; }

/* —— 丙7 键盘焦点三套合一：:focus-visible 统一 2px accent 描边环 ——
   input 的鼠标点击 focus 仍走内嵌环（:focus 基础层），设计不变；仅键盘焦点统一 —— */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* —— 甲13 成本模型校验：红字 + 越界输入红环 —— */
.field-err { color: var(--red); font: var(--f-cap); }
.input-err { box-shadow: inset 0 0 0 2px var(--red) !important; }
.cat-table .cat-act { white-space: nowrap; text-align: right; }

/* —— 甲17 删除账号两档说明区 —— */
.del-acc-opts {
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px 12px; background: #f6f6f9; border-radius: 12px;
}
.del-acc-opts p { margin: 0; }

/* ============================================================
   v1.2.0 统计 UI 优化（甲/乙/丙/丁/戊）
   戊：KPI 形态统一——灰底白块层次法（灰卡 + 白色数值块 + 1px 接触影），
       kpi-hero / yw-bal-cell / yw-daily-cell / kpi-mini 同圆角 --r-xl、同内距、
       数值同字阶（--f-num-l / --f-num-m，tabular-nums）、标签同灰阶；
   甲：数字卡环比小箭头 + 副信息；乙：月度小结卡组；丙：图表标注见 charts.js；丁：资产走势卡。
   字阶一律走 CSS 变量，font 简写必须带 var(--font)（丢字体族=文字被裁事故）。
   ============================================================ */
/* —— 统一 KPI 数字卡（四种形态共用 chrome） —— */
.stat-kpi {
  background: #f6f6f9;
  border-radius: var(--r-xl);
  padding: 12px 14px;
  display: flex; flex-direction: column;
}
.stat-kpi-label { font: var(--f-cap); color: var(--text-2); margin-bottom: 6px; }
.stat-kpi-num {
  background: #fff;
  border-radius: 8px;
  box-shadow: var(--shadow-card); /* 贴地 1px 接触影 */
  padding: 8px 10px;
}
.stat-kpi-val {
  font: var(--f-num-l);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.3px;
  color: var(--text);
  overflow-wrap: anywhere;
}
.stat-kpi-val.in { color: var(--green); }
.stat-kpi-val.out { color: var(--red); }
.stat-kpi-delta { margin-top: 2px; font: var(--f-cap-m); color: var(--text-3); }
.stat-kpi-sub { margin-top: 6px; font: var(--f-cap-2); color: var(--text-3); line-height: 1.5; }
/* 数值字阶·M：月度小结数字块（小卡，同配方） */
.stat-kpi-sm { padding: 10px 12px; }
.stat-kpi-sm .stat-kpi-val { font: var(--f-num-m); letter-spacing: -.2px; }

/* —— 甲：环比小箭头 —— ↑ 绿 / ↓ 红 / 持平 →0%（方案字面色向，全卡统一） —— */
.stat-delta.up { color: var(--green); font-weight: 600; }
.stat-delta.down { color: var(--red); font-weight: 600; }
.stat-delta.flat { color: var(--text-2); }
.stat-delta.none { color: var(--text-3); }
.stat-delta-note { color: var(--text-3); font-weight: 400; }

/* —— 乙：月度小结卡组（数字块 + 支出 Top3 渐变条 + 预算达成小环），放不下换行 —— */
.yw-sum { margin-top: 10px; }
.yw-sum-title { font: var(--f-body-2-m); color: var(--text-2); margin-bottom: 8px; }
.yw-sum-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
.yw-sum-tile { flex: 1 1 130px; }
.yw-sum-top3 { flex: 1.5 1 220px; }
.yw-sum-top-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
.yw-sum-top-name {
  font: var(--f-cap); color: var(--text-2); width: 62px; flex: 0 0 auto;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.yw-sum-top-track {
  flex: 1 1 auto; min-width: 40px; height: 8px;
  background: #ececf1; border-radius: 980px; overflow: hidden;
}
.yw-sum-top-fill {
  height: 100%; border-radius: 980px;
  background: linear-gradient(90deg, #ff8f87, #ff3b30); /* 渐变条 */
}
.yw-sum-top-amt {
  font: var(--f-cap-m); color: var(--text); font-variant-numeric: tabular-nums;
  min-width: 56px; text-align: right;
}
.yw-sum-ring-card { flex: 0 1 210px; }
.yw-sum-ring-row { display: flex; align-items: center; gap: 10px; }
.yw-sum-ring-label { font: var(--f-cap); color: var(--text-2); }
.yw-sum-ring-label strong {
  display: block; margin-top: 2px;
  font: var(--f-num-m); color: var(--text); font-variant-numeric: tabular-nums;
}

/* ===== v1.2.01 时间日历（周视图时间轴，参考 Google Calendar 周视图） ===== */.tl-week-wrap {
  height: calc(100vh - 152px); min-height: 420px;
  display: flex; flex-direction: column;
}
.tl-week {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr));
  border: 1px solid var(--line-soft); border-radius: 12px; background: #fff;
  overflow-y: auto; overflow-x: hidden;
}
.tl-day-head { position: sticky; top: 0; z-index: 3; }
.tl-range-nav {
  display: inline-flex; align-items: center; gap: 2px;
  background: #f2f2f6; border-radius: 999px; padding: 2px 6px;
}
.tl-range-nav .home-tool-btn { width: 26px; height: 26px; }
.tl-week-label {
  font-size: 13px; font-weight: 500; color: var(--text);
  min-width: 210px; text-align: center; font-variant-numeric: tabular-nums;
}
.tl-timer-on { font-variant-numeric: tabular-nums; gap: 4px; }
.tl-gutter { background: #fafafb; border-right: 1px solid var(--line-soft); }
.tl-day-head {
  height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text-3); border-bottom: 1px solid var(--line-soft); background: #fff;
}
.tl-day-head b { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.15; }
.tl-day-head.on b {
  background: var(--accent); color: #fff; border-radius: 999px;
  min-width: 26px; text-align: center;
}
.tl-gh { background: #fafafb; }
.tl-gutter-body { position: relative; height: 1056px; }
.tl-hour {
  position: absolute; left: 0; right: 4px; text-align: right;
  font-size: 10px; color: var(--text-3); transform: translateY(-50%);
  font-variant-numeric: tabular-nums;
}
.tl-col { border-right: 1px solid var(--line-soft); min-width: 0; }
.tl-col:last-child { border-right: none; }
.tl-today-col { background: rgba(0, 113, 227, .035); }
.tl-day-body {
  position: relative; height: 1056px; cursor: pointer;
  background-image: repeating-linear-gradient(to bottom, transparent 0 21px, rgba(0, 0, 0, .045) 21px 22px);
}
.tl-now {
  position: absolute; left: 0; right: 0; height: 2px;
  background: var(--red, #ff3b30); z-index: 4; pointer-events: none;
}
.tl-now::before {
  content: ''; position: absolute; left: -3px; top: -3px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--red, #ff3b30);
}
.tl-block {
  position: absolute; border-radius: 6px; overflow: hidden;
  border-left: 3px solid #ccc; padding: 3px 5px; cursor: pointer;
  font-size: 11px; line-height: 1.3; z-index: 2;
  transition: box-shadow var(--t-fast);
}
.tl-block:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, .12); z-index: 5; }
.tl-block.tl-dragging { opacity: .85; box-shadow: 0 4px 14px rgba(0, 0, 0, .2); z-index: 6; }
.tl-b-t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-b-s { color: var(--text-2); font-size: 10px; font-variant-numeric: tabular-nums; }
.tl-short .tl-b-t { font-size: 10.5px; line-height: 16px; }
.tl-b-ops { position: absolute; top: 2px; right: 2px; }
.tl-b-ops .home-tool-btn { width: 20px; height: 20px; background: rgba(255, 255, 255, .8); border-radius: 5px; }
.tl-b-resize {
  position: absolute; left: 0; right: 0; bottom: 0; height: 6px; cursor: ns-resize;
}
.tl-point, .tl-todo {
  position: absolute; left: 2px; right: 2px; z-index: 3;
  display: flex; align-items: center; gap: 4px;
  font-size: 10.5px; padding: 1px 4px; cursor: pointer;
  background: rgba(255, 255, 255, .92); border-radius: 5px;
  transform: translateY(-50%);
  white-space: nowrap; overflow: hidden;
}
.tl-pt-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.tl-td-dia {
  width: 8px; height: 8px; flex: none; background: var(--accent);
  transform: rotate(45deg); border-radius: 1.5px;
}
.tl-todo.done { opacity: .5; }
.tl-todo.done .tl-td-name { text-decoration: line-through; }
.tl-todo.done .tl-td-dia { background: var(--green, #34c759); }
.tl-pt-name, .tl-td-name { overflow: hidden; text-overflow: ellipsis; }
/* 「待办」简化档：待办条放大加厚（一眼与时间记录档可辨） */
.tl-todo-big {
  padding: 4px 8px; font-size: 12px; border-radius: 8px;
  background: rgba(0, 113, 227, .10); border: 1px solid rgba(0, 113, 227, .22);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
}
.tl-todo-big .tl-td-time {
  margin-left: auto; font-size: 10.5px; color: var(--text-2);
  font-variant-numeric: tabular-nums; font-weight: 500;
}
.tl-todo-big .tl-td-name {
  display: flex; align-items: center; gap: 6px; overflow: hidden;
}
/* 类型管理：颜色盘自选 + 图标点选（系统图标名不外显） */
.tm-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid var(--line-soft); flex-wrap: wrap;
}
.tm-row:last-child { border-bottom: none; }
.tm-color {
  width: 34px; height: 30px; padding: 1px; border: 1px solid var(--line);

.tm-icon-btn {

  border: 1px solid var(--line); border-radius: 8px; background: #fff;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
}
.tm-icon-btn:hover { border-color: var(--accent); }
.tm-icon-slot { flex-basis: 100%; }
.tm-icon-grid {
  display: flex; flex-wrap: wrap; gap: 4px; padding: 6px;
  background: #f6f6f9; border-radius: 10px; margin: 4px 0;
}
.tm-icon-cell {
  width: 32px; height: 32px; border: 1px solid transparent; border-radius: 8px;
  background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
.tm-icon-cell:hover { border-color: var(--line); }
.tm-icon-cell.on { border-color: var(--accent); background: var(--accent-soft); }
.tm-new-row {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
}
/* 类型管理行 */
.tm-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 0;
  border-bottom: 1px solid var(--line-soft);
}
.tm-row:last-child { border-bottom: none; }
.tm-sw { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.tm-name { flex: 1; min-height: 0 !important; height: 30px !important; font-size: 13px; }
.tm-color, .tm-icon { min-height: 0 !important; height: 30px !important; font-size: 12px; }

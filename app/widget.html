<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>今日待办</title>
<style>
  /* 桌面小窗 Widget（v1.2.2）：今日待办迷你清单 + 勾完成 + 跳主程序
     视觉对齐全站（白卡/灰底/圆角/字阶），自包含不依赖主 app 脚本 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font: 14px/21px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f6f6f9; color: #1d1d1f;
    overflow: hidden; user-select: none;
    -webkit-app-region: drag; /* 整窗可拖动（贴边挪位） */
  }
  .w-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 8px;
  }
  .w-title { font-size: 15px; font-weight: 600; flex: 1; }
  .w-date { font-size: 11px; color: #8e8e93; font-variant-numeric: tabular-nums; }
  .w-open {
    -webkit-app-region: no-drag;
    border: none; background: rgba(0, 0, 0, .05); color: #424245;
    width: 24px; height: 24px; border-radius: 7px; cursor: pointer;
    font-size: 13px; line-height: 1;
  }
  .w-open:hover { background: rgba(0, 0, 0, .1); }
  .w-list {
    padding: 0 10px 10px; overflow-y: auto; height: calc(100% - 78px);
  }
  .w-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; margin-bottom: 6px; border-radius: 10px;
    background: #fff; border: 1px solid rgba(0, 0, 0, .05);
    cursor: pointer; -webkit-app-region: no-drag;
    transition: background .12s;
  }
  .w-item:hover { background: #eef0f4; }
  .w-item.over { background: #fff2f0; border-color: rgba(255, 59, 48, .18); }
  .w-item.done { background: #f0faf2; opacity: .7; }
  .w-item.skipped { opacity: .45; }
  .w-item.skipped .w-name { text-decoration: line-through; }
  .w-item.done .w-name { text-decoration: line-through; color: #6e6e73; }
  .w-check {
    width: 18px; height: 18px; flex: none; border-radius: 50%;
    border: 1.5px solid #c7c7cc; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px;
  }
  .w-item.done .w-check { background: #34c759; border-color: #34c759; }
  .w-item.over:not(.done) .w-check { border-color: #ff3b30; }
  .w-name {
    flex: 1; min-width: 0; font-size: 12.5px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .w-time {
    flex: none; font-size: 10.5px; color: #8e8e93;
    font-variant-numeric: tabular-nums;
  }
  .w-empty {
    text-align: center; color: #aeaeb2; font-size: 12px; padding: 28px 0;
  }
  .w-foot {
    padding: 6px 14px 10px; font-size: 10.5px; color: #aeaeb2; text-align: center;
    -webkit-app-region: no-drag;
  }
  .w-foot b { color: #0071e3; cursor: pointer; font-weight: 500; }
  .w-tip {
    position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(29, 29, 31, .88); color: #fff; font-size: 11px;
    padding: 6px 12px; border-radius: 8px; opacity: 0; transition: opacity .2s;
    pointer-events: none;
  }
  .w-tip.show { opacity: 1; }
</style>
</head>
<body>
<div class="w-head">
  <div class="w-title">今日待办</div>
  <div class="w-date" id="w-date"></div>
  <button class="w-open" id="w-open" title="打开人生管家">↗</button>
</div>
<div class="w-list" id="w-list"><div class="w-empty">加载中…</div></div>
<div class="w-foot">点击条目勾完成 · <b id="w-main">打开主程序</b></div>
<div class="w-tip" id="w-tip"></div>
<script>
/* 自包含：只依赖 /api/db + /api/save（todos 域），与主程序实时同源 */
(function () {
  'use strict';
  var defs = [], done = {};
  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  var today = ymd(new Date());
  document.getElementById('w-date').textContent =
    (new Date().getMonth() + 1) + '月' + new Date().getDate() + '日';

  function tip(msg) {
    var t = document.getElementById('w-tip');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 1400);
  }
  function esc(s) {
    // 单引号无需转义（用于 HTML 文本节点/双引号属性，安全）
    return String(s == null ? '' : s)
      .replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>')
      .replace(/"/g, '"');
  }
  /* 六种循环判定（与 storage.todoDueOn 同语义） */
  function dueOn(def, ds) {
    if (!def || def.archived || !def.due) return false;
    var start = def.date || '';
    if (def.repeat === 'none') return ds === start;
    if (!start || ds < start) return false;
    if (def.repeatUntil && ds > def.repeatUntil) return false;
    var p = ds.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    var dow = (d.getDay() + 6) % 7;
    if (def.repeat === 'daily') return true;
    if (def.repeat === 'workday') return dow <= 4;
    if (def.repeat === 'weekly') return (def.repeatOn || []).indexOf(dow) >= 0;
    if (def.repeat === 'monthly') {
      var dim = new Date(p[0], p[1], 0).getDate();
      return p[2] === Math.min(Number(def.repeatOn) || 1, dim);
    }
    if (def.repeat === 'ndays') {
      var n = Number(def.interval) || 1;
      var s = String(start).split('-').map(Number);
      var diff = Math.round((d - new Date(s[0], s[1] - 1, s[2])) / 86400000);
      return n > 0 && diff >= 0 && diff % n === 0;
    }
    return false;
  }
  function render() {
    var list = [];
    // 含近 7 天逾期未决（同主页"到时不消失"语义）+ 今日
    defs.forEach(function (d) {
      var added = false;
      for (var off = -7; off <= 0; off++) {
        var dd = new Date();
        dd.setDate(dd.getDate() + off);
        var ds = ymd(dd);
        if (!dueOn(d, ds)) continue;
        var st = (done[d.id] || {})[ds] || {};
        if (st.s) { if (off === 0) list.push({ def: d, s: st.s, ds: ds }); continue; }
        list.push({ def: d, s: '', ds: ds, over: off < 0 });
        added = true;
      }
      if (!added && dueOn(d, today)) {
        var st2 = (done[d.id] || {})[today] || {};
        if (st2.s) list.push({ def: d, s: st2.s, ds: today });
      }
    });
    var PRIO = { high: 0, mid: 1, low: 2 };
    list.sort(function (a, b) {
      if (!!a.s !== !!b.s) return a.s ? 1 : -1;
      var pa = PRIO[a.def.priority] != null ? PRIO[a.def.priority] : 1;
      var pb = PRIO[b.def.priority] != null ? PRIO[b.def.priority] : 1;
      if (pa !== pb) return pa - pb;
      return (a.def.due || '') < (b.def.due || '') ? -1 : 1;
    });
    var nowHM = String(new Date().getHours()).padStart(2, '0') + ':' + String(new Date().getMinutes()).padStart(2, '0');
    var html = list.map(function (it) {
      var over = it.over || (!it.s && (it.def.due || '') < nowHM);
      var cls = it.s === 'done' ? ' done' : it.s === 'skipped' ? ' skipped' : (over ? ' over' : '');
      var tm = it.def.start ? (it.def.start + '-' + (it.def.due || '')) : (it.def.due || '');
      return '<div class="w-item' + cls +
        '" data-id="' + esc(it.def.id) + '" data-ds="' + esc(it.ds || today) + '" title="点击勾完成/取消">' +
        '<div class="w-check">' + (it.s === 'done' ? '✓' : it.s === 'skipped' ? '—' : '') + '</div>' +
        '<div class="w-name">' + esc(it.def.name) + '</div>' +
        '<div class="w-time">' + esc(tm) + '</div></div>';
    }).join('');
    document.getElementById('w-list').innerHTML =
      html || '<div class="w-empty">今天没有待办 ✓</div>';
    document.querySelectorAll('.w-item').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-id');
        var ds = el.getAttribute('data-ds') || today;
        var st = (done[id] || {})[ds] || {};
        var willDone = !st.s;
        // 本地乐观更新
        done[id] = done[id] || {};
        if (willDone) done[id][ds] = { t: new Date().toISOString(), s: 'done' };
        else delete done[id][ds];
        render();
        // 保存前重读最新 todos（防主程序期间改 defs/其他 done 被旧快照覆盖丢失）
        fetch('/api/db').then(function (r) { return r.json(); }).then(function (d) {
          var fresh = d.todos || {};
          defs = fresh.defs || [];
          var freshDone = fresh.done || {};
          freshDone[id] = freshDone[id] || {};
          if (willDone) freshDone[id][ds] = { t: new Date().toISOString(), s: 'done' };
          else delete freshDone[id][ds];
          done = freshDone;
          render();
          return fetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ target: 'todos', acc: '', data: { defs: defs, done: done } })
          });
        }).then(function (r) { return r.json(); }).then(function (out) {
          if (!out || !out.ok) tip('保存失败');
        }).catch(function () { tip('保存失败（服务未开？）'); });
      });
    });
  }
  function load() {
    fetch('/api/db').then(function (r) { return r.json(); }).then(function (d) {
      defs = (d.todos && d.todos.defs) || [];
      done = (d.todos && d.todos.done) || {};
      render();
    }).catch(function () {
      document.getElementById('w-list').innerHTML =
        '<div class="w-empty">无法连接服务<br>请先运行 lovelife.bat</div>';
    });
  }
  function goMain() {
    // 互斥切换：开主窗关小窗（服务端统一管窗，window.open 在 --app 下会开成普通 tab）
    fetch('/api/window-switch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'main' })
    });
  }
  document.getElementById('w-open').addEventListener('click', goMain);
  document.getElementById('w-main').addEventListener('click', goMain);
  load();
  setInterval(load, 60000); // 每分钟与主程序对齐（勾选本地即时、轮询兜底）
})();
</script>
</body>
</html>
